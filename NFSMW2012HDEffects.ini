; NFSMW2012 HD Effects by Aero_
; NFSMW2012 高清特效补丁 (作者：Aero_)
; https://github.com/AeroWidescreen/NFSMW2012HDEffects
; 由 Tikimson 翻译，适用于2.0.2版本，未作任何参数改动。
; https://github.com/Tikimson

[MAIN]
Resolution = 1                       // 决定整个RESOLUTION部分是否启用。
ViewDistance = 1                     // 决定整个VIEW DISTANCE部分是否启用。
Gameplay = 1                         // 决定整个GAMEPLAY部分是否启用。
General = 1                          // 决定整个GENERAL部分是否启用。
Hotkeys = 1                          // 决定整个HOTKEYS部分是否启用。

[RESOLUTION]
VehicleReflectionRes = 1024          // 控制车辆反射的分辨率。 (Min = 128 | Max = 1024 | Default = 256)
WaterReflectionRes = 1024            // 控制水面反射的分辨率。 (Min = 128 | Max = 4096 | Default = 512)
ShadowRes = 2048                     // 控制场景阴影的分辨率。 (Min = 128 | Max = 2730 | Default = 2048)
HeadlightShadowRes = 2048            // 控制车头灯投射阴影的分辨率。 (Min = 128 | Max = 2730 | Default = 1024)
ReflectionShadowRes = 2048           // 控制反射效果中阴影的分辨率。 (Min = 128 | Max = 2730 | Default = 256)

[VIEW DISTANCE]
WorldDistance = 15000.0              // 控制整个世界的视距。 (Min = 100 | Max = 15000 | Default = 15000)
WaterReflectionDistance = 1000.0     // 控制水面反射的视距。 (Min = 100 | Max = 15000 | Default = 1000) 
VehicleReflectionDistance = 400.0    // 控制车辆反射的视距。 (Min = 100 | Max = 15000 | Default = 100)

[GAMEPLAY]
EnableHiddenCameras = 1              // 启用未使用的摄像机模式（camera modes）。 (Hood Cam = 1 | and Overhead Cam = 2)
TimeCycleSpeed = 1.0                 // 决定世界昼夜交替速度的倍率。 (Inactive = -1 | Min = 0 | Max = 8 | Default = 1)
WreckResistance = 1.0                // 决定车辆耐用度的倍率。在线多人模式下无效。 (Inactive = -1 | Min = 0 | Max = 4 | Default = 1)

[GENERAL]
CinematicMode = 1                    // 启用一项隐藏设置，可提升细节水平、分辨率及各类特效的质量。 (Partial LOD = 1 | Full LOD = 2)
AutoRefreshGraphics = 1              // 解决草地、灌木和树木在更改分辨率之前无法渲染的问题。
HighShadowRefreshRate = 0            // 使阴影实时更新，而不是每隔几秒钟更新一次。
MotionBlurStrength = 5.0             // 控制动态模糊效果的强度并提高一致性。 (Inactive = -1 | Min = 0 | Max = 10 | Default = 1)
SetReflectionShadow = -1             // 允许用户在不影响其他阴影的情况下启用或禁用反射阴影。 (Inactive = -1 | ReflShadow Off = 0 | ReflShadow On = 1)
SetDOF = -1                          // 允许用户在不影响动态模糊的情况下启用或禁用景深效果。 (Inactive = -1 | DOF Off = 0 | DOF On = 1)

[HOTKEYS]
; https://www.cambiaresearch.com/articles/15/javascript-char-codes-key-codes
ToggleHUD = 1                        // 决定游戏启动时是否启用HUD（平视显示器）。
ToggleHUDhotkey = 117                // 控制游戏过程中切换HUD显示的设置。 (Default = 117 [F6])
ToggleScreenDirt = 1                 // 决定启动时是否启用屏幕污渍（Screen Dirt）效果。
ToggleScreenDirthotkey = 118         // 控制游戏过程中切换屏幕污渍效果（Screen Dirt）的设置。 (Default = 118 [F7])
ToggleTimeOfDayhotkey = 119          // 允许用户在午夜、黎明、日出、正午、日落和黄昏之间循环切换。 (Default = 119 [F8])